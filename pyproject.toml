[project]
name = "tekla-mcp-server"
version = "0.2.3"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
pythonpath = ["src"]
testpaths = [
    "tests",
]
